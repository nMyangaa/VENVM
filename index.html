<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENVM LINE — Engineered to Outperform</title>
<meta name="description" content="VENVM LINE — high-performance automotive parts &amp; tuning. ECU tuning, carbon-fibre aero, titanium exhausts, forged wheels and intakes.">

<!-- Design-system tokens, fonts &amp; effects (local, relative paths) -->
<link rel="stylesheet" href="ds/styles.css">

<!-- Material Symbols icon font (optional — icons degrade gracefully if offline) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--background); color: var(--on-background); font-family: var(--font-body); }
  ::selection { background: rgba(161, 201, 255, 0.3); }
  .venvm-search::placeholder { color: rgba(191,199,213,0.5); }
  @keyframes venvm-bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }
  .venvm-bounce { animation: venvm-bounce 1.6s var(--ease-standard) infinite; }
  @media (prefers-reduced-motion: reduce) { .venvm-bounce { animation: none; } }
  .brand-wheel { scrollbar-width: thin; scrollbar-color: var(--outline-variant) transparent; }
  .brand-wheel::-webkit-scrollbar { height: 6px; }
  .brand-wheel::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 3px; }
  .brand-wheel::-webkit-scrollbar-track { background: transparent; }
  .quote-input::placeholder { color: var(--text-placeholder); }
  /* First-paint backdrop so the page is matte-black before React mounts */
  #root:empty::before { content: ""; display: block; min-height: 100vh; background: var(--background, #0A0B0E); }
</style>
</head>
<body>
<div id="root"></div>

<!-- React (production UMD, self-hosted — no external CDN required) -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- VENVM LINE design-system component bundle (defines window.VENVMLINEDesignSystem_2d12f7) -->
<script src="ds/_ds_bundle.js"></script>

<!-- Storefront app — pre-compiled from JSX to plain JS (no in-browser Babel). Sets window.StorefrontApp. -->
<script src="StorefrontApp.js"></script>

<!-- Mount -->
<script>
  (function mount() {
    var App = window.StorefrontApp;
    if (!App) { return setTimeout(mount, 30); }
    var root = ReactDOM.createRoot(document.getElementById('root'));
    // Tweak defaults carried over from the design source.
    root.render(React.createElement(App, { brandsScale: 1.45, getInTouchScale: 0.7 }));
  })();
</script>
</body>
</html>
